<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sales Report Mobile Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        [x-cloak] {
            display: none !important;
        }
        
        /* Mobile PDF Modal Optimizations */
        @media (max-width: 640px) {
            /* Ensure modal takes full screen on mobile */
            .pdf-modal-mobile {
                height: 100vh !important;
                height: 100dvh !important; /* Dynamic viewport height for mobile browsers */
                border-radius: 0 !important;
            }
            
            /* Optimize iframe for mobile */
            .pdf-modal-mobile iframe {
                width: 100% !important;
                height: 100% !important;
                border: none !important;
            }
            
            /* Prevent body scroll when modal is open */
            body.modal-open {
                overflow: hidden !important;
                position: fixed !important;
                width: 100% !important;
            }
        }
        
        /* Ensure proper z-index stacking */
        .pdf-modal {
            z-index: 9999 !important;
        }
        
        /* Smooth transitions */
        .modal-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-100">
    <div x-data="testModalApp()" class="p-4">
        <h1 class="text-2xl font-bold mb-4">Test Sales Report Mobile Modal</h1>
        
        <!-- Test Buttons -->
        <div class="space-y-4">
            <button @click="openPdfModal('pos')" 
                    class="block w-full sm:w-auto px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700">
                Test POS Invoice Modal
            </button>
            
            <button @click="openPdfModal('inter_outlet')" 
                    class="block w-full sm:w-auto px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                Test Inter Outlet Invoice Modal
            </button>
            
            <button @click="openPdfModal('invoice')" 
                    class="block w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Test Invoice Modal (Info Message)
            </button>
        </div>
        
        <!-- Device Info -->
        <div class="mt-8 p-4 bg-white rounded-lg shadow">
            <h2 class="font-semibold mb-2">Device Info:</h2>
            <p class="text-sm text-slate-600">Screen Width: <span x-text="window.innerWidth"></span>px</p>
            <p class="text-sm text-slate-600">Screen Height: <span x-text="window.innerHeight"></span>px</p>
            <p class="text-sm text-slate-600">User Agent: <span x-text="navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop'"></span></p>
        </div>

        <!-- Modal PDF Preview - Mobile Optimized -->
        <div x-show="showPdfModal" 
             x-cloak 
             class="fixed inset-0 pdf-modal flex items-center justify-center p-2 sm:p-4" 
             style="display: none;"
             x-init="$watch('showPdfModal', value => {
               if (value) {
                 document.body.classList.add('modal-open');
               } else {
                 document.body.classList.remove('modal-open');
               }
             })">
          <!-- Backdrop -->
          <div x-show="showPdfModal" 
               x-transition:enter="ease-out duration-300" 
               x-transition:enter-start="opacity-0" 
               x-transition:enter-end="opacity-100" 
               x-transition:leave="ease-in duration-200" 
               x-transition:leave-start="opacity-100" 
               x-transition:leave-end="opacity-0" 
               class="fixed inset-0 bg-black/50" 
               @click="closePdfModal()"></div>

          <!-- Modal Content -->
          <div x-show="showPdfModal" 
               x-transition:enter="ease-out duration-300" 
               x-transition:enter-start="opacity-0 scale-95" 
               x-transition:enter-end="opacity-100 scale-100" 
               x-transition:leave="ease-in duration-200" 
               x-transition:leave-start="opacity-100 scale-100" 
               x-transition:leave-end="opacity-0 scale-95" 
               class="relative w-full h-full max-w-7xl bg-white rounded-lg sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden pdf-modal-mobile modal-transition">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4 border-b border-slate-200 bg-white flex-shrink-0">
              <h3 class="text-base sm:text-lg font-semibold text-slate-800">Preview Invoice</h3>
              <button @click="closePdfModal()" 
                      class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                <i class='bx bx-x text-xl sm:text-2xl'></i>
              </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 relative bg-slate-50 min-h-0">
              <!-- PDF Iframe -->
              <iframe x-show="pdfUrl" 
                      :src="pdfUrl" 
                      class="w-full h-full border-0" 
                      frameborder="0"
                      loading="lazy"
                      allowfullscreen></iframe>
              
              <!-- Loading State -->
              <div x-show="!pdfUrl" class="absolute inset-0 flex items-center justify-center bg-white">
                <div class="text-center">
                  <div class="animate-spin rounded-full h-8 w-8 sm:h-12 sm:w-12 border-b-2 border-blue-600 mx-auto"></div>
                  <p class="mt-3 sm:mt-4 text-sm sm:text-base text-slate-600">Memuat invoice...</p>
                </div>
              </div>
              
              <!-- Info Message for Invoice -->
              <div x-show="showInfoMessage" class="absolute inset-0 flex items-center justify-center bg-white p-8">
                <div class="text-center max-w-md">
                  <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-100 flex items-center justify-center">
                    <i class='bx bx-info-circle text-3xl text-blue-600'></i>
                  </div>
                  <h4 class="text-lg font-semibold text-slate-800 mb-2">Preview Tidak Tersedia</h4>
                  <p class="text-slate-600">Preview invoice belum tersedia untuk transaksi lama. Silakan gunakan menu Invoice untuk melihat detail.</p>
                </div>
              </div>
            </div>

            <!-- Modal Footer - Mobile Optimized -->
            <div class="flex items-center justify-between gap-2 px-4 py-3 sm:px-6 sm:py-4 border-t border-slate-200 bg-slate-50 flex-shrink-0">
              <!-- Mobile: Show PDF info -->
              <div class="flex-1 sm:hidden">
                <p class="text-xs text-slate-500">Geser untuk zoom, pinch untuk perbesar</p>
              </div>
              
              <!-- Desktop: Empty space -->
              <div class="hidden sm:flex flex-1"></div>
              
              <!-- Close Button -->
              <button @click="closePdfModal()" 
                      class="px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-colors">
                Tutup
              </button>
            </div>
          </div>
        </div>
    </div>

    <script>
        function testModalApp() {
            return {
                showPdfModal: false,
                pdfUrl: '',
                showInfoMessage: false,

                openPdfModal(type) {
                    this.showInfoMessage = false;
                    this.pdfUrl = '';
                    
                    if (type === 'pos') {
                        // Simulate POS PDF URL
                        this.pdfUrl = 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf';
                        this.showPdfModal = true;
                    } else if (type === 'inter_outlet') {
                        // Simulate Inter Outlet PDF URL
                        this.pdfUrl = 'https://www.africau.edu/images/default/sample.pdf';
                        this.showPdfModal = true;
                    } else {
                        // Show info message for invoice
                        this.showInfoMessage = true;
                        this.showPdfModal = true;
                    }
                },

                closePdfModal() {
                    this.showPdfModal = false;
                    this.pdfUrl = '';
                    this.showInfoMessage = false;
                    // Ensure body scroll is restored
                    document.body.classList.remove('modal-open');
                }
            };
        }
    </script>
</body>
</html>
