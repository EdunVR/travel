<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Alpine.js Depreciation Book Selection</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="fixedAssetsManagement()" x-init="init()" class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Alpine.js Depreciation Book Selection</h1>
        
        <!-- Debug Info -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-2">Debug Info</h2>
            <div class="space-y-2 text-sm">
                <div>Books loaded: <span x-text="books.length"></span></div>
                <div>Show modal: <span x-text="showBookSelectionModal"></span></div>
                <div>Selected book: <span x-text="selectedBookForPosting"></span></div>
                <div>Book selection type: <span x-text="bookSelectionType"></span></div>
            </div>
        </div>

        <!-- Test Buttons -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-4">Test Actions</h2>
            <div class="space-x-4">
                <button @click="openBookSelectionModal('single', 123)" 
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Test Single Posting
                </button>
                <button @click="openBookSelectionModal('bulk')" 
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Test Bulk Posting
                </button>
                <button @click="showBookSelectionModal = true" 
                        class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    Show Modal Directly
                </button>
            </div>
        </div>

        <!-- Book Selection Modal -->
        <div x-show="showBookSelectionModal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[9999]" 
             @click.self="showBookSelectionModal = false"
             style="display: none;">
          <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl">
            <div class="p-6 border-b border-slate-200">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-lg font-semibold text-slate-800">Pilih Buku Akuntansi</h3>
                  <p class="text-sm text-slate-600 mt-1">Pilih buku akuntansi untuk posting penyusutan</p>
                </div>
                <button @click="cancelBookSelection()" class="text-slate-400 hover:text-slate-600">
                  <i class="bx bx-x text-2xl"></i>
                </button>
              </div>
            </div>
            
            <div class="p-6 space-y-4">
              <!-- Book Selection -->
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                  Pilih Buku Akuntansi <span class="text-red-500">*</span>
                </label>
                <select x-model="selectedBookForPosting" 
                        class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                  <option value="">Pilih Buku Akuntansi</option>
                  <template x-for="book in books" :key="book.id">
                    <option :value="book.id" x-text="book.name + ' (' + book.type + ')'"></option>
                  </template>
                </select>
              </div>

              <!-- Selected Book Info -->
              <div x-show="selectedBookForPosting" class="bg-green-50 rounded-lg p-3 border border-green-200">
                <div class="flex items-center gap-2">
                  <i class="bx bx-check-circle text-green-600"></i>
                  <div class="text-sm">
                    <span class="font-medium text-green-800">Buku Terpilih:</span>
                    <span class="text-green-700" x-text="books.find(b => b.id == selectedBookForPosting)?.name"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="p-6 border-t border-slate-200 flex justify-end gap-3">
              <button @click="cancelBookSelection()" 
                      class="px-4 py-2 text-sm text-slate-600 hover:text-slate-800 border border-slate-200 rounded-lg hover:bg-slate-50">
                Batal
              </button>
              <button @click="confirmBookSelection()" 
                      :disabled="!selectedBookForPosting"
                      :class="!selectedBookForPosting ? 'opacity-50 cursor-not-allowed bg-slate-400' : 'hover:bg-blue-700 bg-blue-600'"
                      class="px-4 py-2 text-white text-sm rounded-lg transition-colors">
                <span x-show="bookSelectionType === 'single'">
                  <i class="bx bx-check mr-1"></i>Posting Penyusutan
                </span>
                <span x-show="bookSelectionType === 'bulk'">
                  <i class="bx bx-check-double mr-1"></i>Posting Semua
                </span>
              </button>
            </div>
          </div>
        </div>
    </div>

    <script>
        function fixedAssetsManagement() {
            return {
                // Book selection modal state
                showBookSelectionModal: false,
                selectedBookForPosting: '',
                bookSelectionType: 'single', // 'single' or 'bulk'
                pendingDepreciationId: null,
                
                // Mock data
                books: [
                    { id: 1, name: 'Buku Utama', type: 'General' },
                    { id: 2, name: 'Buku Cabang', type: 'Branch' }
                ],

                async init() {
                    console.log('✅ Alpine.js initialized successfully');
                    console.log('📚 Mock books loaded:', this.books);
                },

                // Book selection modal functions
                openBookSelectionModal(type, depreciationId = null) {
                    console.log('📖 Opening book selection modal:', { type, depreciationId });
                    console.log('📚 Available books:', this.books);
                    
                    this.bookSelectionType = type;
                    this.pendingDepreciationId = depreciationId;
                    this.selectedBookForPosting = '';
                    
                    // Auto-select first book if only one available
                    if (this.books && this.books.length === 1) {
                        this.selectedBookForPosting = this.books[0].id;
                        console.log('🎯 Auto-selected single book:', this.books[0].name);
                    }
                    
                    this.showBookSelectionModal = true;
                    console.log('✅ Book selection modal opened');
                },

                cancelBookSelection() {
                    console.log('❌ Cancelling book selection');
                    this.showBookSelectionModal = false;
                    this.selectedBookForPosting = '';
                    this.bookSelectionType = 'single';
                    this.pendingDepreciationId = null;
                },

                async confirmBookSelection() {
                    console.log('✅ Confirming book selection:', this.selectedBookForPosting);
                    
                    if (!this.selectedBookForPosting) {
                        alert('Pilih buku akuntansi terlebih dahulu');
                        return;
                    }

                    const selectedBook = this.books.find(book => book.id == this.selectedBookForPosting);
                    console.log('📖 Selected book details:', selectedBook);

                    this.showBookSelectionModal = false;

                    // Mock posting
                    alert(`Mock posting to book: ${selectedBook.name} (Type: ${this.bookSelectionType})`);
                    
                    this.cancelBookSelection();
                }
            };
        }
    </script>
</body>
</html>
