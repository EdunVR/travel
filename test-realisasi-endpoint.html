<!DOCTYPE html>
<html>
<head>
    <title>Test Realisasi Per Item Endpoint</title>
</head>
<body>
    <h1>Test Realisasi Per Item Endpoint</h1>
    <button onclick="testEndpoint()">Test Endpoint</button>
    <pre id="result"></pre>

    <script>
        async function testEndpoint() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';
            
            try {
                // Get CSRF token from meta tag or cookie
                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || 
                                 getCookie('XSRF-TOKEN');
                
                const url = 'https://poshan.my.id/hm/admin/finance/rab/3/realisasi-per-item';
                
                const data = {
                    realisasi: [
                        {
                            id_rab_detail: 19,
                            nama_komponen: 'Test Komponen',
                            keterangan: 'Test realisasi dari HTML',
                            jumlah: 1000000
                        }
                    ]
                };
                
                resultEl.textContent = 'Sending request to: ' + url + '\n\n';
                resultEl.textContent += 'Data: ' + JSON.stringify(data, null, 2) + '\n\n';
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken,
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                resultEl.textContent += 'Response Status: ' + response.status + '\n\n';
                
                const result = await response.json();
                resultEl.textContent += 'Response: ' + JSON.stringify(result, null, 2);
                
            } catch (error) {
                resultEl.textContent += 'Error: ' + error.message + '\n';
                resultEl.textContent += error.stack;
            }
        }
        
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
</body>
</html>
